[project]
name = "py-bootstrap"
version = "0.3.0"
description = "Bootstrap your Python Package Development"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "copier-template-extensions>=0.3.3", "jinja2>=3.1.6" ]

[dependency-groups]
dev = [
  "pydantic>=2.12.5",
  "pytest>=9.0.2",
  "ruff>=0.14.9",
  "ty>=0.0.3",
  "zensical>=0.0.15",
]

[tool.ruff]
line-length = 88
indent-width = 4
[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-line-length = "dynamic"
docstring-code-format = false
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma (may conflict with ruff formatter)
  "D203",   # incorrect-blank-line-before-class (conflicts with D211)
  "D213",   # multi-line-summary-second-line (conflicts with D212)
]
per-file-ignores."**/{tests,scripts}/*" = [
  "ANN001",
  "ANN201",
  "D",
  "E402",
  "INP001",
  "S101",
  "T201",
]
per-file-ignores."extensions.py" = [ "D" ]
fixable = [ "ALL" ]
unfixable = []

[tool.pyproject-fmt]
table_format = "long"
collapse_tables = [ "project.authors" ]

[tool.pytest]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Dirty template changes included automatically",
]

[tool.coverage.run]
relative_files = true

[tool.git-cliff.changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | lower }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^[a|A]dd", group = "<!-- 0 -->🚀 Features" },
  { message = "^[s|S]upport", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 2 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^test", group = "<!-- 4 -->🧪 Testing" },
  { message = "^chore\\(release\\): bump version to", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^revert", group = "<!-- 5 -->◀️ Revert" },
  { message = "^[r|R]emove", group = "<!-- 5 -->◀️ Revert" },
  { message = "^.*: remove", group = "<!-- 5 -->◀️ Revert" },
  { message = "^.*: delete", group = "<!-- 5 -->◀️ Revert" },
  { message = "^chore|^ci", group = "<!-- 6 -->💼 Other" },
  { message = ".*", group = "<!-- 6 -->💼 Other" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
