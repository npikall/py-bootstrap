name: Python Code Quality
on: [push]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock_file:
    name: Check lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv lock --check
  linting:
    name: Lint
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv run ruff check .
  formatting:
    name: Format
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv run ruff format --check .
  type_consistency:
    name: Type check
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv sync --locked --all-extras --dev
      - run: uv run ty check .
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv sync --locked --all-extras --dev
      - run: uv run --with pytest pytest tests/ -rsx --verbose --color=yes
